apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.shared.appId }}-dapr
  labels:
    {{- include "dapr-shared.labels" . | nindent 4 }}
spec:
  type: {{ default "ClusterIP" .Values.shared.service.type }}
  ports:
    - name: dapr-http
      port: {{ .Values.shared.daprd.httpPort }}
      protocol: TCP
      targetPort: {{ .Values.shared.daprd.httpPort }}
    - name: dapr-grpc
      port: {{ .Values.shared.daprd.grpcPort }}
      protocol: TCP
      targetPort: {{ .Values.shared.daprd.grpcPort }}
    - name: dapr-internal
      port: {{ .Values.shared.daprd.internalGrpcPort }}
      protocol: TCP
      targetPort: {{ .Values.shared.daprd.internalGrpcPort }}
    - name: dapr-metrics
      port: {{ .Values.shared.daprd.metrics.port }}
      protocol: TCP
      targetPort: {{ .Values.shared.daprd.metrics.port }}
  selector:
    {{- include "dapr-shared.selectorLabels" . | nindent 4 }}
